<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Facture — ETS Safouene Daoud et Cie</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eceff2;color:#17191d;font:13px Arial,sans-serif}.toolbar{position:sticky;top:0;background:#111318;color:#fff;padding:12px;display:flex;justify-content:center;gap:10px}.toolbar button{border:0;border-radius:5px;padding:9px 15px;cursor:pointer}.primary{background:#e4002b;color:#fff}.sheet{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:18mm;box-shadow:0 5px 24px #0002}.head{display:flex;justify-content:space-between;border-bottom:3px solid #e4002b;padding-bottom:18px}.logo{font-size:34px;font-weight:900;font-style:italic}.company{text-align:right;line-height:1.55}.title{display:flex;justify-content:space-between;align-items:end;margin:26px 0 18px}.title h1{margin:0;font-size:24px}.meta{line-height:1.6}.parties{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:18px 0}.box{border:1px solid #d6d9df;border-radius:6px;padding:13px}.box h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;color:#777}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#f3f4f6;font-size:10px;text-transform:uppercase}.num{text-align:right}.totals{width:46%;margin:22px 0 0 auto}.totals div{display:flex;justify-content:space-between;padding:6px 0}.totals .grand{border-top:2px solid #111;font-size:16px;font-weight:bold;margin-top:6px;padding-top:10px}.payments{margin-top:28px}.foot{margin-top:55px;border-top:1px solid #ddd;padding-top:12px;text-align:center;color:#777;font-size:11px}.error{color:#b00020;padding:30px;text-align:center}
    @media(max-width:800px){.sheet{width:100%;min-height:auto;margin:0;padding:20px;box-shadow:none}.parties{grid-template-columns:1fr}.toolbar{position:static}.totals{width:100%}}
    @media print{body{background:#fff}.toolbar{display:none}.sheet{margin:0;box-shadow:none;width:auto;min-height:auto;padding:12mm}@page{size:A4;margin:0}}
  </style>
</head>
<body><div class="toolbar"><button onclick="history.back()">← Retour</button><button class="primary" onclick="window.print()">Imprimer / Enregistrer PDF</button></div><main id="root" class="sheet">Chargement…</main>
<script>
(()=>{const esc=v=>String(v??'').replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('fr-TN',{minimumFractionDigits:3,maximumFractionDigits:3})+' TND';const fmt=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';let session;try{session=JSON.parse(localStorage.getItem('supply_kiosk_session_v1')||'null')}catch{}const id=new URLSearchParams(location.search).get('id');if(!session?.authToken||!id){location.replace('/');return}fetch('/api/garage/invoices/'+encodeURIComponent(id)+'/detail',{headers:{Authorization:'Bearer '+session.authToken}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail||'Facture introuvable');return d}).then(d=>{const i=d.invoice,o=d.order,c=d.customer,v=d.vehicle,p=d.payments||[];document.title='Facture '+i.invoice_number;document.getElementById('root').innerHTML=`<div class="head"><div><div class="logo">KIA</div><b>ETS Safouene Daoud et Cie</b></div><div class="company">Gestion automobile et atelier<br>Tunisie</div></div><div class="title"><div><h1>FACTURE</h1><div class="meta"><b>${esc(i.invoice_number)}</b><br>Ordre : ${esc(i.order_number)}</div></div><div class="meta">Date : ${fmt(i.issued_at)}<br>Échéance : ${fmt(i.due_at)}<br>État : <b>${esc(i.status)}</b></div></div><div class="parties"><div class="box"><h3>Facturé à</h3><b>${esc(c?.name)}</b><br>${esc(c?.address||'')}<br>${esc(c?.phone||'')}<br>${esc(c?.tax_id?'MF : '+c.tax_id:'')}</div><div class="box"><h3>Véhicule</h3><b>${esc(v?.make)} ${esc(v?.model)}</b><br>Immatriculation : ${esc(v?.registration)}<br>VIN : ${esc(v?.vin||'—')}<br>Kilométrage : ${esc(o?.mileage_in||v?.mileage||'—')} km</div></div><table><thead><tr><th>Désignation</th><th>Type</th><th class="num">Qté</th><th class="num">Prix unitaire</th><th class="num">Total</th></tr></thead><tbody>${(o?.lines||[]).map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.line_type)}</td><td class="num">${l.quantity}</td><td class="num">${money(l.unit_price)}</td><td class="num">${money(l.total)}</td></tr>`).join('')}</tbody></table><div class="totals"><div><span>Sous-total</span><b>${money(i.subtotal)}</b></div><div><span>Remise</span><span>− ${money(i.discount)}</span></div><div><span>TVA (${i.tax_rate} %)</span><span>${money(i.tax_amount)}</span></div><div class="grand"><span>Total</span><span>${money(i.total)}</span></div><div><span>Payé</span><span>${money(i.paid_amount)}</span></div><div><b>Solde</b><b>${money(i.balance)}</b></div></div>${p.length?`<div class="payments"><h3>Règlements</h3>${p.map(x=>`${fmt(x.paid_at)} · ${esc(x.method)} · ${money(x.amount)}${x.reference?' · '+esc(x.reference):''}`).join('<br>')}</div>`:''}<div class="foot">Merci pour votre confiance — ETS Safouene Daoud et Cie</div>`}).catch(e=>document.getElementById('root').innerHTML='<div class="error">'+esc(e.message)+'</div>')})();
</script></body></html>
