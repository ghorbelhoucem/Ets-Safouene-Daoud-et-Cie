services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ets_safouene
    volumes:
      - ets_safouene_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ets -d ets_safouene"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "61938:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ets:${POSTGRES_PASSWORD}@db:5432/ets_safouene
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ETS_ADMIN_PIN: ${ETS_ADMIN_PIN:?Set ETS_ADMIN_PIN in .env}
      ETS_STOREKEEPER_PIN: ${ETS_STOREKEEPER_PIN:?Set ETS_STOREKEEPER_PIN in .env}
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:61938}
      LEGACY_WEBAPP_URL: ${LEGACY_WEBAPP_URL:-}
      SHEET_SYNC_INTERVAL_MINUTES: ${SHEET_SYNC_INTERVAL_MINUTES:-10}
      SLACK_TRANSACTIONS_WEBHOOK_URL: ${SLACK_TRANSACTIONS_WEBHOOK_URL:-}
      SLACK_PURCHASE_WEBHOOK_URL: ${SLACK_PURCHASE_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ets_safouene_pgdata:
