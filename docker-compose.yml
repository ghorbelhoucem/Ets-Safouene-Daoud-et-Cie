services:
  db:
    image: postgres:16-alpine
    container_name: ets-safouene-db
    environment:
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: supply
      POSTGRES_DB: supply
    volumes:
      - ets_safouene_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    networks:
      default:
        aliases:
          - ets-safouene-api.railway.internal
    image: ets-safouene-api:local
    container_name: ets-safouene-api
    environment:
      DATABASE_URL: postgresql+psycopg2://supply:supply@db:5432/supply
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}\n      ETS_ADMIN_PIN: ${ETS_ADMIN_PIN:?Set ETS_ADMIN_PIN in .env}\n      ETS_STOREKEEPER_PIN: ${ETS_STOREKEEPER_PIN:?Set ETS_STOREKEEPER_PIN in .env}\n      ETS_DEVELOPER_PIN: ${ETS_DEVELOPER_PIN:?Set ETS_DEVELOPER_PIN in .env}
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: "*"
      GOOGLE_SHEET_SYNC_ENABLED: ${GOOGLE_SHEET_SYNC_ENABLED:-false}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      LEGACY_WEBAPP_URL: ${LEGACY_WEBAPP_URL:-}
      SHEET_SYNC_INTERVAL_MINUTES: ${SHEET_SYNC_INTERVAL_MINUTES:-10}
      SLACK_TRANSACTIONS_WEBHOOK_URL: ${SLACK_TRANSACTIONS_WEBHOOK_URL:-}
      SLACK_PURCHASE_WEBHOOK_URL: ${SLACK_PURCHASE_WEBHOOK_URL:-}
      SOP_WEBAPP_URL: ${SOP_WEBAPP_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  kiosk:
    build: .
    image: ets-safouene-supply:local
    container_name: ets-safouene-supply
    ports:
      - "61938:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ets_safouene_pgdata:
