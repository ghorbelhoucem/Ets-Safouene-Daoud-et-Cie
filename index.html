<style>
  :root{
    --bg:#050505;
    --panel:#101010;
    --panel-alt:#181818;
    --border:#343434;
    --accent:#c8102e;
    --accent-hover:#ef2948;
    --accent-dim:#570917;
    --success:#f5f5f5;
    --danger:#e51b36;
    --text:#ffffff;
    --text-dim:#b5b5b5;
    --tag-bg:#080808;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#050505;color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;
    background-image:radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:22px 22px;}
  .app{max-width:min(1200px,94vw);margin:0 auto;padding:28px clamp(16px,3vw,40px) 40px;min-height:100vh;box-sizing:border-box;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:64px;height:34px;border-radius:7px;background:#f2f0ea;color:#1c1e22;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,0.25);padding:7px 9px;box-sizing:border-box;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text{display:flex;flex-direction:column;justify-content:center;line-height:1.2;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);font-family:'Inter',sans-serif;font-size:11.5px;padding:7px 15px;border-radius:4px;cursor:pointer;transition:all .15s ease;}
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);}
  input:focus, select:focus{outline:none;border-color:var(--accent) !important;box-shadow:0 0 0 3px rgba(200,16,46,0.15);}
  .brand h1{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:22px;margin:0;text-transform:uppercase;}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.08em;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:0.05em;text-align:right;line-height:1.4;}
  .status-dot{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:0.05em;}
  .status-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);}
  .status-dot.offline .dot{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .nav-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;padding:8px 14px;border-radius:3px;cursor:pointer;text-transform:uppercase;transition:all .15s ease;}
  .nav-btn:hover{color:var(--text);border-color:var(--accent);}
  .nav-btn.active{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .stage{background:transparent;border:none;padding:32px 0;min-height:calc(100vh - 150px);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
  .reader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px 0 6px;text-align:center;}
  .slot{width:280px;height:80px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--panel-alt);}
  .hint{color:var(--text-dim);font-size:13px;margin-top:16px;font-family:'Inter',sans-serif;}
  .go-btn{margin-top:22px;background:var(--accent);color:#1c1e22;border:none;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;font-size:14px;padding:12px 30px;border-radius:4px;cursor:pointer;transition:background .15s ease;}
  .go-btn:hover{background:var(--accent-hover);}
  .go-btn:disabled{background:var(--panel-alt);color:var(--text-dim);cursor:not-allowed;}
  .greet{text-align:center;margin-bottom:24px;}
  .greet .name{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .greet .code{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13px;letter-spacing:0.1em;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;}
  .menu-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .18s ease;}
  .menu-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  .menu-card:active{transform:translateY(-1px);}
  .menu-card .big{font-size:28px;margin-bottom:8px;}
  .menu-card .label{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:14px;}
  .menu-card .sub{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .menu-card.disabled{opacity:0.4;cursor:not-allowed;}
  .menu-card.disabled:hover{transform:none;border-color:var(--border);}
  .open-list{max-width:100%;margin:22px auto 0;}
  .open-list h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin:0 0 8px;}
  .open-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:6px;font-size:13px;}
  .open-row.overdue{border-color:var(--danger);}
  .open-row .due{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .open-row.overdue .due{color:var(--danger);}
  .tag{display:inline-block;background:var(--tag-bg);border:1px solid #000;border-radius:2px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#e8e6e1;}
  .item-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;max-width:100%;margin:18px auto 0;max-height:clamp(320px,52vh,700px);overflow-y:auto;padding-right:4px;}
  .item-list>.empty-note{grid-column:1/-1;}
  .item-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 16px;cursor:pointer;transition:border-color .15s ease;}
  .item-row:hover{border-color:var(--accent);}
  .item-row.selected{border-color:var(--accent);background:rgba(200,16,46,0.08);}
  .item-name{font-weight:600;font-size:14px;}
  .item-meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .stock{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .stock.low{color:var(--danger);}
  .back-link{color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-block;margin-bottom:14px;padding:6px 14px;border-radius:5px;transition:all .15s ease;}
  .back-link:hover{background:var(--accent);color:#1c1e22;}
  .back-link:hover{color:var(--text);}
  .form-row{max-width:min(600px,100%);margin:20px auto 0;}
  .form-row label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
  .form-row input,.form-row select{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:14px;}
  .confirm-box{text-align:center;padding:40px 0;}
  .confirm-box .icon{font-size:42px;margin-bottom:10px;}
  .confirm-box .msg{font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;}
  .confirm-box .detail{color:var(--text-dim);font-size:13px;margin-top:8px;}
  .report-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .report-tabs .nav-btn{flex-shrink:0;}
  .qty-stepper{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:46px;height:46px;font-size:24px;line-height:1;border-radius:8px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);cursor:pointer;flex-shrink:0;user-select:none;transition:all .12s ease;}
  .qty-btn:hover{border-color:var(--accent);color:var(--accent);}
  .qty-btn:active{transform:scale(0.92);}
  .qty-stepper-input{width:64px;text-align:center;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:11px 6px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:16px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  th{text-align:left;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-size:10.5px;padding:10px;background:var(--panel-alt);border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  tbody tr:hover{background:rgba(200,16,46,0.05);}
  tr.overdue td{color:var(--danger);}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);}
  .pill.open{color:var(--accent);border-color:var(--accent-dim);}
  .pill.done{color:var(--success);border-color:#255c37;}
  .pill.over{color:var(--danger);border-color:#5c2527;}
  .stockbar{background:var(--panel-alt);border:1px solid var(--border);border-radius:5px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stock-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:8px;margin-bottom:8px;}
  .empty-note{color:var(--text-dim);text-align:center;padding:30px 0;font-size:13px;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:-8px 0 12px;}
  .confirm-panel{max-width:420px;margin:24px auto 0;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:20px;}
  .confirm-panel .q{font-size:14px;margin-bottom:16px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:13px;letter-spacing:0.03em;}
  .confirm-actions .yes{background:var(--accent);color:#1c1e22;border-color:var(--accent);}
  .confirm-actions .no{background:transparent;color:var(--text-dim);}
  .loading-wrap{display:flex;align-items:center;justify-content:center;height:100%;min-height:340px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.05em;}
  .banner-error{background:#3a1f1f;border:1px solid var(--danger);color:#f2b9b9;border-radius:5px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}

  /* === kiosk UX improvements === */
  html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button,.menu-card,.item-row{touch-action:manipulation;}

  /* Larger, more tappable role cards */
  .menu-card{padding:28px 18px;min-height:120px;}
  .menu-card .big{font-size:36px;margin-bottom:10px;}
  .menu-card .label{font-size:15px;}
  .menu-card:active{transform:scale(0.97) !important;}

  /* Bigger touch targets throughout */
  .go-btn{padding:15px 36px;font-size:15px;border-radius:5px;}
  .go-btn:active{transform:scale(0.97);}
  .btn-ghost{padding:11px 20px;font-size:12.5px;border-radius:5px;}
  .item-row{min-height:66px;padding:14px 16px;}
  .item-name{font-size:15px;}
  .nav-btn{padding:10px 16px;}

  /* Animated loading spinner */
  .spin-ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:kiosk-spin .72s linear infinite;margin:0 auto 14px;}
  @keyframes kiosk-spin{to{transform:rotate(360deg);}}

  /* On-screen numpad for PIN / operator ID */
  .numpad-wrap{max-width:290px;margin:0 auto;}
  .numpad-display{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.4em;text-align:center;padding:14px 20px;background:var(--panel-alt);border:2px solid var(--border);border-radius:7px;min-height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:border-color .15s,box-shadow .15s;}
  .numpad-display.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,16,46,.12);}
  .numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .numpad-key{height:66px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;border-radius:7px;cursor:pointer;transition:background .1s,transform .08s,border-color .1s;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
  .numpad-key:hover{background:var(--panel);border-color:var(--accent-dim);}
  .numpad-key:active{transform:scale(0.91);background:rgba(200,16,46,.14);}
  .numpad-key.del{color:var(--text-dim);font-size:19px;}
  .numpad-key.del:hover{border-color:var(--danger);color:var(--danger);}
  .numpad-key.go{background:var(--accent);color:#1c1e22;border-color:var(--accent);font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .numpad-key.go:hover{background:var(--accent-hover);}
  .numpad-key.go:disabled{background:var(--panel-alt);color:var(--text-dim);border-color:var(--border);cursor:not-allowed;transform:none;}
  .numpad-key.go:active:not(:disabled){transform:scale(0.95);}

  /* Pulsing scan icon */
  @keyframes scan-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(1.1);}}
  .scan-pulse{display:inline-block;animation:scan-pulse 2s ease-in-out infinite;}

  /* Pop-in animation on confirmation */
  @keyframes pop-in{0%{transform:scale(.3) rotate(-15deg);opacity:0;}65%{transform:scale(1.18) rotate(4deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
  .confirm-pop{display:inline-block;animation:pop-in .45s cubic-bezier(.34,1.56,.64,1) both;}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script src="./config.js"></script>
<script src="./client.js"></script>
<script src="./inventory.js"></script>
<script src="./machine.js"></script>
<script src="./store.js"></script>
<script src="./keyboardScanner.js"></script>
<script src="./renderer.js"></script>
<script>
(function(){
  const API_BASE = (window.ETS_CONFIG && window.ETS_CONFIG.apiBaseUrl) || '/api';
  const apiClient = window.EtsApi.createApiClient(API_BASE, { timeoutMs: 9000, retries: 2 });
  let authToken = null;
  let pendingPin = null;
  const domain = window.EtsDomain;
  const { upgradeInteractiveElements, setButtonBusy } = window.EtsUi;
  const machine = window.EtsMachine.createSupplyMachine();
  const store = window.EtsStore.createStore(machine, { current: 'idle' });

  const ICONS = { 'Tools': '🧰', 'Station Parts': '🚗' };

  const ROLES = {
    management: { label: 'Management', sub: 'Administration et rapports', icon: '📋', kind: 'pin', loginRoleKey: 'management' },
    majdi: { label: 'Majdi', sub: 'Sorties et retours de matériel', icon: '👤', kind: 'pin', loginRoleKey: 'maintenance' }
  };

  // Credentials live on the API (hashed). Kiosk only collects PIN/password.

  let screen = 'idle';
  let selectedRoom = 'storage';
  const ROOM_CATEGORIES = {
    storage: ['Tools', 'Station Parts'],
  };
  const ROOM_LABELS = { storage: 'Stock automobile' };
  function roomCategories(){ return ROOM_CATEGORIES[selectedRoom] || ROOM_CATEGORIES.storage; }
  function inRoom(reference){ return roomCategories().includes(reference); }

  // Profils actifs du stock automobile.
  // allows Supervisor. Intentionally different allow-lists per room.
  function canManageCurrentRoom(){
    return Boolean(currentPerson && currentPerson.role === 'Management');
  }
  function canViewReports(){
    return Boolean(currentPerson && ['Management', 'Maintenance'].includes(currentPerson.role));
  }
  let pendingRole = null;
  let pendingName = null;
  let pendingSharedNames = null;
  let activeNumpadKeyHandler = null; // ensures only one physical-keyboard listener is ever active
  let pinError = null;
  let pendingOperatorId = null;
  let operatorIdError = null;
  let operatorPasswordError = null;
  let currentPerson = null; // {name, role, code}  code = "Name/Role"
  const AUTO_LOGOUT_MS = 10 * 60 * 1000; // 10 minutes of inactivity
  let autoLogoutTimer = null;
  let autoLoggedOut = false;

  // Session persistence — survives a page refresh. Using localStorage (not
  // sessionStorage) since some managed/enterprise browser setups clear
  // sessionStorage more aggressively than expected. The actual 10-minute
  // logout boundary is enforced by the lastActivity timestamp check below,
  // not by which storage type this is — closing the browser does NOT clear
  // this by itself, so the idle-timeout check is what really matters.
  const SESSION_KEY = 'supply_kiosk_session_v1';

  // Only these screens make sense to resume directly on refresh — anything
  // mid-credential-entry or a transient success screen just falls back to menu.
  const RESTORABLE_SCREENS = new Set([
    'roomSelect','menu','scanPrompt','scanConfirm','scanTakeDetail','takeCategory','take','basketReview',
    'return','returnScanPrompt','returnBasketReview',
    'restockCategory','restockPick','restockBasketReview','report'
  ]);

  let sessionRestoreNotice = null;

  function saveSession(){
    if(!currentPerson || !authToken){ localStorage.removeItem(SESSION_KEY); return; }
    try{
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        currentPerson, authToken, lastActivity: Date.now(),
        screen, basket, returnBasket, restockBasket, selectedRoom
      }));

  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}

  function loadPersistedSessionEarly(){
    let raw;
    try{ raw = localStorage.getItem(SESSION_KEY); }catch(e){ return false; }
    if(!raw) return false;
    let data;
    try{ data = JSON.parse(raw); }catch(e){ return false; }
    if(!data || !data.currentPerson || !data.authToken) return false;
    const elapsed = Date.now() - (data.lastActivity || 0);
    if(elapsed >= AUTO_LOGOUT_MS){
      clearSession();
      return false; // already timed out while the tab was away/reloading
    }
    currentPerson = data.currentPerson;
    authToken = data.authToken;
    apiClient.setToken(authToken);
    selectedRoom = ROOM_CATEGORIES[data.selectedRoom] ? data.selectedRoom : 'storage';
    screen = RESTORABLE_SCREENS.has(data.screen) ? data.screen : 'menu';
    basket = Array.isArray(data.basket) ? data.basket : [];
    returnBasket = Array.isArray(data.returnBasket) ? data.returnBasket : [];
    restockBasket = Array.isArray(data.restockBasket) ? data.restockBasket : [];
    return true;
  }

  // Lightweight pre-login persistence — separate from saveSession() above,
  // since no currentPerson/authToken exist yet at this stage. Only ever
  // stores WHICH screen and room, never a typed PIN/password — those always
  // start blank again after a refresh, by design, for security.
  const PRELOGIN_KEY = 'supply_kiosk_prelogin_v1';
  const PRELOGIN_RESTORABLE_SCREENS = new Set(['idle','deptPin']);

  function savePreLoginState(){
    if(currentPerson) { try{ localStorage.removeItem(PRELOGIN_KEY); }catch(e){} return; }
    if(!PRELOGIN_RESTORABLE_SCREENS.has(screen)) return;
    try{
      localStorage.setItem(PRELOGIN_KEY, JSON.stringify({ selectedRoom, screen, pendingRole }));
    }catch(e){ /* storage unavailable — position just won't survive a refresh */ }
  }

  function loadPreLoginStateEarly(){

    if(!raw) return;
    let data;
    try{ data = JSON.parse(raw); }catch(e){ return; }
    if(!data) return;
    if(data.selectedRoom && ROOM_CATEGORIES[data.selectedRoom]) selectedRoom = data.selectedRoom;
    if(PRELOGIN_RESTORABLE_SCREENS.has(data.screen)){
      screen = data.screen;
      if(data.pendingRole && ROLES[data.pendingRole]) pendingRole = data.pendingRole;
    }

  // restore — someone else may have taken/returned/restocked items while

  function revalidateRestoredBaskets(){
    let changed = false;

    basket = basket.filter(b=>{
      if(!inventoryMap[b.itemName]){ changed = true; return false; }
      const cap = availableOf(b.itemName) - basketQtyForExcluding(b.itemName, b.id);
      if(cap < 1){ changed = true; return false; }
      if(b.qty > cap){ b.qty = cap; changed = true; }
      return true;
    });

    returnBasket = returnBasket.filter(tx=>{
      const stillOpen = historyRows.some(h=>h.txId===tx.txId && h.returnedAt==='Not returned');
      if(!stillOpen){ changed = true; }
      return stillOpen;
    });

    restockBasket = restockBasket.filter(b=>{
      if(b.isNewItem && inventoryMap[b.itemName]){ changed = true; return false; }
      return true;
    });

    if(changed){
      sessionRestoreNotice = 'Bienvenue — certaines quantités ont été ajustées selon l’état actuel du stock.';
    }
  }

  // Real photos for items we have pictures of — everything else falls back

  // Renders a small photo thumbnail if we have one for this item, otherwise

  function qtyStepperHTML(inputId, value, min){

    return `<div class="qty-stepper">

    </div>`;

  // One global handler covers every qty stepper rendered anywhere, current or future.
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('.qty-btn');
    if(!btn) return;
    const targetId = btn.getAttribute('data-qty-target');
    const dir = parseInt(btn.getAttribute('data-qty-dir'),10);
    const input = document.getElementById(targetId);
    if(!input) return;
    const min = parseInt(input.getAttribute('min'),10) || 1;
    let val = parseInt(input.value,10) || min;
    val += dir;
    if(val < min) val = min;
    input.value = val;
    input.dispatchEvent(new Event('input', {bubbles:true}));
    input.dispatchEvent(new Event('change', {bubbles:true}));
  });

  function itemThumbHTML(itemName, width, height){

  function getWeekRange(offset){
    const now = new Date();
    const day = now.getDay(); // 0=Sun..6=Sat
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(now);
    monday.setHours(0,0,0,0);
    monday.setDate(now.getDate() + diffToMonday + (offset * 7));
    const nextMonday = new Date(monday);
    nextMonday.setDate(monday.getDate() + 7);
    const sunday = new Date(nextMonday);
    sunday.setDate(nextMonday.getDate() - 1);
    const fmt = (d)=> d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const label = `Week of ${fmt(monday)} – ${fmt(sunday)}${offset===0 ? ' (this week)' : ''}`;
    return { weekStart: monday, weekEnd: nextMonday, label };
  }

  function stageDeptPin(stage, banner){
    const role = ROLES[pendingRole];
    let pin = '';
    const maxLen = 4;

    function numpadUpdate(){
      const display = document.getElementById('numpadDisplay');
      if(!display) return;
      display.textContent = Array.from({length:maxLen},(_,i)=> i<pin.length ? '●' : '○').join(' ');
      display.classList.toggle('active', pin.length > 0);
      const goKey = document.getElementById('numpadGo');
      if(goKey) goKey.disabled = pin.length < maxLen;
    }

    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Retour</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — saisissez votre code PIN à 4 chiffres</div>
        ${pinError ? `<div class="error-msg" style="margin-top:0;margin-bottom:14px;">${esc(pinError)}</div>` : ''}
        <div class="numpad-wrap">

            <button class="numpad-key go" id="numpadGo" disabled>Se connecter</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('back').onclick = ()=>{ pendingRole=null; pinError=null; screen='idle'; renderStage(); };

    const submit = async ()=>{
      if(pin.length < maxLen) return;
      const result = await apiClient.loginPin({ roleKey: role.loginRoleKey || pendingRole, pin });
      if(result && result.needs_name){
        pendingPin = pin;
        pendingSharedNames = result.shared_names || [];
        pinError = null;
        screen = 'deptPinPickName';
        renderStage();
        return;
      }
      if(!result || !result.ok || !result.token){
        pinError = (result && result.error) || 'Code PIN incorrect. Réessayez.';
        pin = '';
        renderStage();
        return;
      }
      authToken = result.token;
      apiClient.setToken(authToken);
      currentPerson = result.person;
      startAutoLogoutTimer();
      pendingRole = null;
      pendingPin = null;
      pinError = null;
      screen = 'menu';
      await withLoading(()=>refreshRemoteIfStale(4000));
      renderStage();
    };

    stage.querySelectorAll('[data-digit]').forEach(btn=>{
      btn.onclick = ()=>{ if(pin.length<maxLen){ pin+=btn.getAttribute('data-digit'); numpadUpdate(); } };
    });
    document.getElementById('numpadDel').onclick = ()=>{ pin=pin.slice(0,-1); numpadUpdate(); };
    document.getElementById('numpadGo').onclick = submit;

    function handleKey(e){
      if(!document.getElementById('numpadDisplay')){ document.removeEventListener('keydown', handleKey); return; }
      if(e.key>='0'&&e.key<='9'){ if(pin.length<maxLen){ pin+=e.key; numpadUpdate(); } }
      else if(e.key==='Backspace'){ e.preventDefault(); pin=pin.slice(0,-1); numpadUpdate(); }
      else if(e.key==='Enter'){ submit(); }
    }
    if(activeNumpadKeyHandler) document.removeEventListener('keydown', activeNumpadKeyHandler);
    activeNumpadKeyHandler = handleKey;
    document.addEventListener('keydown', handleKey);
  }

  // Operator credentials are verified by the API.

  function stageOperatorId(stage, banner){
    const role = ROLES[pendingRole];
    let digits = '';
    const maxLen = 3;

    function numpadUpdate(){
      const display = document.getElementById('numpadDisplay');
      if(!display) return;
      display.textContent = digits || '—';
      display.classList.toggle('active', digits.length > 0);
      const goKey = document.getElementById('numpadGo');
      if(goKey) goKey.disabled = digits.length < 1;
    }

    stage.innerHTML = banner + `
      <span class="back-link" id="back">&larr; Retour</span>
      <div class="reader-wrap" style="padding-top:6px;">
        <div class="hint" style="margin-top:0;margin-bottom:18px;">${role.icon} ${esc(role.label)} — enter your operator ID</div>
        ${operatorIdError ? `<div class="error-msg" style="margin-top:0;margin-bottom:14px;">${esc(operatorIdError)}</div>` : ''}
        <div class="numpad-wrap">
          <div class="numpad-display" id="numpadDisplay" style="font-size:26px;letter-spacing:.2em;">—</div>
          <div class="numpad-grid">
            ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="numpad-key" data-digit="${n}">${n}</button>`).join('')}
            <button class="numpad-key del" id="numpadDel">⌫</button>
            <button class="numpad-key" data-digit="0">0</button>
            <button class="numpad-key go" id="numpadGo" disabled>Next</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('back').onclick = ()=>{ pendingRole=null; operatorIdError=null; screen='idle'; renderStage(); };

    const submit = ()=>{
      if(!digits) return;
      const idNum = String(parseInt(digits, 10)); // normalize '007' -> '7'
      pendingOperatorId = idNum;
      operatorIdError = null;
      screen = 'operatorPassword';
      renderStage();
    };

    stage.querySelectorAll('[data-digit]').forEach(btn=>{
      btn.onclick = ()=>{ if(digits.length<maxLen){ digits+=btn.getAttribute('data-digit'); numpadUpdate(); } };
    });
    document.getElementById('numpadDel').onclick = ()=>{ digits=digits.slice(0,-1); numpadUpdate(); };
    document.getElementById('numpadGo').onclick = submit;

    function handleKey(e){
      if(!document.getElementById('numpadDisplay')){ document.removeEventListener('keydown', handleKey); return; }
      if(e.key>='0'&&e.key<='9'){ if(digits.length<maxLen){ digits+=e.key; numpadUpdate(); } }
      else if(e.key==='Backspace'){ e.preventDefault(); digits=digits.slice(0,-1); numpadUpdate(); }
      else if(e.key==='Enter'){ submit(); }
    }
    if(activeNumpadKeyHandler) document.removeEventListener('keydown', activeNumpadKeyHandler);
    activeNumpadKeyHandler = handleKey;
    document.addEventListener('keydown', handleKey);
  }

            succeeded.push(entry);
          }else{
            remaining.push(entry);
            if(!restockBasketError){
              restockBasketError = `Arrêt sur « ${entry.itemName} » : ${result.error || 'une erreur est survenue'}. ${succeeded.length} sur ${restockBasket.length} ont été enregistrés ; les autres restent dans la liste.`;
            }
          }
        }
        await refreshRemote();
        restockBasket = remaining;
        if(remaining.length){
          renderStage();
          return;
        }
        const detailLines = succeeded.map(b=>`${b.qty} × ${b.itemName}`).join(', ');
        confirmInfo = { icon:'📥', msg: `${succeeded.length} article(s) réapprovisionné(s)`, detail: detailLines };
        screen = 'confirm';
        renderStage();
      };
    }
  }

  // ---------- take ----------
  function hoursLabel(hours){
    if(hours===4) return 'end of day';
    if(hours===24) return 'tomorrow';
    if(hours===72) return '3 days';
    if(hours===168) return '1 week';
    return hours + ' hrs';
  }

  function basketQtyFor(itemName){
    return basket.filter(b=>b.itemName===itemName).reduce((s,b)=>s+b.qty,0);
  }

  function basketQtyForExcluding(itemName, excludeId){
    return basket.filter(b=>b.itemName===itemName && b.id!==excludeId).reduce((s,b)=>s+b.qty,0);
  }

  function addToBasketAndReview(itemName, category, qty, hours){
    const existing = basket.find(b=>b.itemName === itemName);
    if(existing){
      existing.qty += qty;
    }else{
      basket.push({ id: ++basketIdCounter, itemName, category, qty, hours });
    }
    screen = 'basketReview';
    renderStage();
  }

  let basketError = null;

  function stageBasketReview(stage, banner){
    stage.innerHTML = banner + `
      <div class="greet" style="margin-bottom:10px;"><div class="name" style="font-size:18px;">Vos articles (${basket.length})</div></div>
      <table>
        <thead><tr><th>Article</th><th>Qté</th><th>Détail</th><th></th></tr></thead>

          ${basket.length ? basket.map(b=>`

              <td>${b.category==='Tools' ? 'Retour ' + hoursLabel(b.hours) : (b.category==='Station Parts' ? 'Usage unique' : '')}</td>
              <td><button class="btn-ghost" data-remove="${b.id}" style="padding:4px 10px;font-size:10.5px;">Supprimer</button></td>
            </tr>
          `).join('') : `<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:20px;">Aucun article ajouté.</td></tr>`}
        </tbody>
      </table>
      ${basketError ? `<div class="error-msg" style="margin-top:14px;">${esc(basketError)}</div>` : ''}
      <div style="display:flex;gap:10px;margin-top:22px;max-width:460px;margin-left:auto;margin-right:auto;">
        <button class="btn-ghost" id="addMoreBtn" style="flex:1;padding:12px;">➕ Ajouter un autre article</button>
        <button class="go-btn" id="confirmAllBtn" style="flex:1;margin-top:0;" ${!basket.length?'disabled':''}>Confirmer le retrait (${basket.length})</button>
      </div>
      <div style="text-align:center;margin-top:16px;"><span class="back-link" id="cancelBasket">Annuler et revenir au menu</span></div>
    `;
    document.getElementById('addMoreBtn').onclick = ()=>{ basketError=null; screen='scanPrompt'; renderStage(); };
    document.getElementById('cancelBasket').onclick = ()=>{ basket=[]; basketError=null; screen='menu'; renderStage(); };
    stage.querySelectorAll('[data-qty-for]').forEach(input=>{
      input.onchange = ()=>{
        const id = parseInt(input.getAttribute('data-qty-for'),10);
        const item = basket.find(b=>b.id===id);
        if(!item) return;
        let newQty = parseInt(input.value,10);
        if(!newQty || newQty < 1) newQty = 1;
        const cap = availableOf(item.itemName) - basketQtyForExcluding(item.itemName, id);
        if(cap >= 0 && newQty > cap){
          basketError = `Seulement ${cap} unité(s) de « ${item.itemName} » disponible(s) ; quantité ajustée.`;
          newQty = Math.max(1, cap);
        } else {
          basketError = null;
        }
        item.qty = newQty;
        renderStage();
      };
    });
    stage.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = parseInt(btn.getAttribute('data-remove'),10);
        basket = basket.filter(b=>b.id!==id);
        renderStage();
      };
    });
    if(basket.length){
      document.getElementById('confirmAllBtn').onclick = async ()=>{
        const confirmBtn = document.getElementById('confirmAllBtn');
        setButtonBusy(confirmBtn, true, 'Saving...');
        basketError = null;
        const items = basket.map(b=>({
          item: b.itemName,
          category: b.category,
          qty: b.qty,
          expectedReturn: b.hours ? new Date(Date.now() + b.hours*3600*1000).toISOString() : null
        }));
        const result = await apiClient.takeBatch({
          client_request_id: apiClient.newRequestId(),
          person: currentPerson.name,
          role: currentPerson.role,
          items
        });
        await refreshRemote();
        if(!result.ok){
          basketError = result.error || 'Erreur lors de l’enregistrement. Vérifiez la connexion puis confirmez à nouveau.';
          renderStage();
          return;
        }
        const detailLines = basket.map(b=>`${b.qty} × ${b.itemName}`).join(', ');
        confirmInfo = { icon:'✅', msg: `${basket.length} article(s) enregistré(s)`, detail: detailLines };
        basket = [];
        screen = 'confirm';
        renderStage();
      };
    }
  }

      });
      lastReturnAdded = extraCount ? `${tx.item} × ${extraCount+1}` : tx.item;
      pendingReturnTx = null;

  function tryHandleReturnScan(text){
    const tx = historyRows.find(h=>h.txId===pendingReturnTx);
    if(!tx){
      returnScanError = 'Cet article est introuvable. Revenez en arrière et sélectionnez-le à nouveau.';
      renderStage();
      return;
    }
    const trimmed = text.trim();
    const norm = normalizeText(trimmed);
    const expected = normalizeText(tx.item);
    let isMatch = norm === expected || norm.includes(expected) || expected.includes(norm);
    if(!isMatch){
      // Last resort: ignore punctuation entirely (scanner keyboard-layout mangling).
      const normAlnum = domain.normalizeAlnum(trimmed);
      const expectedAlnum = domain.normalizeAlnum(tx.item);
      if(normAlnum.length >= 2 && normAlnum === expectedAlnum) isMatch = true;
    }
    if(!isMatch){
      returnScanError = `Code scanné : « ${trimmed} » — il ne correspond pas à « ${tx.item} ». Réessayez ou utilisez « Retourner sans code QR ».`;
      renderStage();
      return;
    }
    returnScanError = null;
    addToReturnBasket(tx);
    const extraCount = pendingReturnExtraTxIds.length;
    pendingReturnExtraTxIds.forEach(txId=>{
      const extra = historyRows.find(h=>h.txId===txId);
      if(extra) addToReturnBasket(extra);
    });
    lastReturnAdded = extraCount ? `${tx.item} × ${extraCount+1}` : tx.item;
    pendingReturnTx = null;
    pendingReturnExtraTxIds = [];
    screen = 'return';
    renderStage();
  }

    stage.querySelectorAll('[data-remove-item]').forEach(btn=>{

      document.getElementById('returnConfirmAllBtn').onclick = async ()=>{
        const confirmBtn = document.getElementById('returnConfirmAllBtn');
        setButtonBusy(confirmBtn, true, 'Saving...');
        returnBasketError = null;

        const result = await apiClient.returnBatch({
          client_request_id: apiClient.newRequestId(),

        });

        confirmInfo = { icon:'✅', msg: `${returnBasket.length} article(s) retourné(s)`, detail: detailLines };
        returnBasket = [];
        screen = 'confirm';
        renderStage();
      };
    }
  }

                    const s = summary[name];
                    const net = s.restocked - s.taken;
                    const netStr = net > 0 ? `+${net}` : `${net}`;
                    return `<tr>
                      <td>${itemThumbHTML(name, 26)} ${esc(name)}</td>
                      <td>${s.taken > 0 ? '-'+s.taken : '—'}</td>
                      <td>${s.restocked > 0 ? '+'+s.restocked : '—'}</td>
                      <td style="color:${net<0?'var(--danger)':net>0?'var(--success)':'var(--text-dim)'};font-weight:600;">${netStr}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
              ` : `<div class="empty-note">Aucune activité cette semaine.</div>`}
            `;
          })()}
        </div>
      ` : reportTab==='warranty' ? `
        <div>
          <div class="hint" style="margin-top:0;margin-bottom:16px;">Tous les problèmes sous garantie, du plus récent au plus ancien.</div>
          ${warrantyReports.length ? `
          <table>
            <thead><tr><th>Signalé</th><th>Par</th><th>Pièce</th><th>N° de série</th><th>Problème</th></tr></thead>
            <tbody>
              ${warrantyReports.map(w=>`
                <tr>
                  <td>${fmtDate(w.timestamp)}</td>
                  <td>${esc(w.reportedBy)}</td>
                  <td>${itemThumbHTML(w.partName, 26)} ${esc(w.partName)}</td>
                  <td>${esc(w.serialNumber)}</td>
                  <td>${esc(w.issue)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          ` : `<div class="empty-note">Aucun problème sous garantie signalé.</div>`}
        </div>
      ` : reportTab==='purchase' ? `
        <div>
          <div class="hint" style="margin-top:0;margin-bottom:16px;">Articles au seuil de commande ou en dessous — à réapprovisionner rapidement.</div>
          ${(()=>{
            const needsPurchase = Object.values(inventoryMap)
              .filter(it=>inRoom(it.reference) && it.reference !== 'SOPs' && Number(it.quantity) <= Number(it.reorder_min || 5))
              .sort((a,b)=> Number(a.quantity) - Number(b.quantity));
            if(!needsPurchase.length) return `<div class="empty-note">Aucun réapprovisionnement nécessaire actuellement.</div>`;
            return `<div class="stock-grid">${needsPurchase.map(it=>`
              <div class="stockbar" style="border-color:var(--danger);">
                <span>${itemThumbHTML(it.item, 26)} ${esc(it.item)}</span>
                <span class="stock low">${it.quantity} restante(s) (min. ${it.reorder_min || 5})</span>
              </div>
            `).join('')}</div>`;
          })()}
        </div>
      ` : `
        ${rows.length ? `
        <table>
          <thead><tr><th>Pris par</th><th>Article</th><th>Retiré</th><th>Prévu</th><th>Retourné</th><th>Retourné par</th></tr></thead>
          <tbody>
            ${(()=>{
              // Consolidate rows that are identical except for qty — same item,
              // same person, same moment, same return status — into one line
              // with a combined quantity, instead of listing each one separately.
              const groups = {};
              const order = [];
              rows.forEach(h=>{
                const key = [h.item, h.personRole, h.timestamp, h.expectedReturn, h.returnedAt, h.returnedBy].join('|');
                if(!groups[key]){ groups[key] = { first: h, qty: 0 }; order.push(key); }
                groups[key].qty += Number(h.qty) || 1;
              });
              return order.map(key=>{
                const { first: h, qty } = groups[key];
                return `<tr class="${isOverdue(h) ? 'overdue':''}">
                  <td>${esc(h.personRole)}</td>
                  <td>${itemThumbHTML(h.item, 28)} ${esc(h.item)}${qty>1?` <span class="tag">× ${qty}</span>`:''}</td>
                  <td>${fmtDate(h.timestamp)}</td>
                  <td>${fmtDate(h.expectedReturn)}</td>
                  <td>${h.returnedAt==='N/A' ? '<span class="pill">n/a</span>' : (h.returnedAt==='Not returned' ? (isOverdue(h) ? '<span class="pill over">en retard</span>' : '<span class="pill open">sorti</span>') : '<span class="pill done">'+fmtDate(h.returnedAt)+'</span>')}</td>
                  <td>${h.returnedAt==='Not returned' ? '—' : esc(h.returnedBy || '—')}</td>
                </tr>`;
              }).join('');
            })()}
          </tbody>
        </table>` : `<div class="empty-note">Aucune donnée pour le moment.</div>`}
      `}
    `;
    document.getElementById('reportBack').onclick = ()=>{
      screen = reportReturnScreen;
      renderStage();
    };
    stage.querySelectorAll('.report-tabs button').forEach(b=>{
      b.onclick = ()=>{ reportTab = b.getAttribute('data-t'); renderStage(); };
    });
    const stockSearchInput = document.getElementById('reportStockSearchInput');
    if(stockSearchInput){
      stockSearchInput.oninput = ()=>{
        reportStockSearchQuery = stockSearchInput.value;
        renderStage();
        setTimeout(()=>{
          const el = document.getElementById('reportStockSearchInput');
          if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
        },0);
      };
    }
    const weekPrevBtn = document.getElementById('weekPrevBtn');
    if(weekPrevBtn) weekPrevBtn.onclick = ()=>{ reportWeekOffset -= 1; renderStage(); };
    const weekNextBtn = document.getElementById('weekNextBtn');
    if(weekNextBtn) weekNextBtn.onclick = ()=>{ if(reportWeekOffset < 0){ reportWeekOffset += 1; renderStage(); } };
  }

  // ---------- barcode/QR scanner support ----------
  // The Inateck BCST-23 (and most handheld scanners) acts like a keyboard:
  // it "types" the encoded text very fast, then presses Enter. We detect that
  // speed pattern to tell a scan apart from normal human typing, and jump
  // straight to that item once a match is found in the current inventory.
  const SCAN_MAX_GAP_MS = 300;

  function normalizeText(s){
    return domain.normalizeText(s);
  }

  let lastScanAdded = null;

  function tryHandleScan(text){
    if(!currentPerson) return; // must be signed in first
    if(screen === 'returnScanPrompt') return tryHandleReturnScan(text);
    if(screen !== 'scanPrompt') return; // only accept take-flow scans on the scan screen
    const trimmed = text.trim();
    const norm = normalizeText(trimmed);
    if(norm === 'other'){
      scanNotFoundError = null;
      pendingScanItem = OTHER_SENTINEL;
      screen = 'scanConfirm';
      renderStage();
      return;
    }
    const candidateNames = Object.keys(inventoryMap).filter(name => inRoom(inventoryMap[name].reference));
    let matchName = candidateNames.find(name => {
      const inv = inventoryMap[name];
      const barcode = inv && inv.barcode ? normalizeText(inv.barcode) : '';
      return barcode && barcode === norm;
    });
    if(!matchName){
      matchName = candidateNames.find(name => normalizeText(name) === norm);
    }
    if(!matchName){
      // fallback fuzzy match only if no exact barcode/name hit
      matchName = candidateNames.find(name => {
        const n = normalizeText(name);
        return n.length >= 4 && (norm.includes(n) || n.includes(norm));
      });
    }
    if(!matchName){
      // Last resort: ignore punctuation entirely, in case a scanner's keyboard
      // layout mangled characters like ( ) / — e.g. "Power Cable (PC/Monitor)".
      const normAlnum = domain.normalizeAlnum(trimmed);
      if(normAlnum.length >= 2){
        matchName = candidateNames.find(name => domain.normalizeAlnum(name) === normAlnum);
      }
    }
    if(!matchName){
      scanNotFoundError = `Aucun article ne correspond au scan « ${trimmed} ». (${Object.keys(inventoryMap).length} articles chargés) Réessayez ou choisissez manuellement.`;
      renderStage();
      return;
    }
    const inv = inventoryMap[matchName];
    const avail = availableOf(matchName) - basketQtyFor(matchName);
    if(avail < 1){
      scanNotFoundError = `« ${matchName} » n’est pas disponible actuellement.`;
      renderStage();
      return;
    }
    scanNotFoundError = null;
    const hours = (inv.reference==='Tools' || inv.reference==='SOPs') ? 24 : null; // default; adjustable in the review list
    const existingScanEntry = basket.find(b=>b.itemName === matchName);
    if(existingScanEntry){
      existingScanEntry.qty += 1;
    }else{
      basket.push({ id: ++basketIdCounter, itemName: matchName, category: inv.reference, qty: 1, hours });
    }
    lastScanAdded = matchName;
    renderStage(); // stay on the scan screen — ready for the next scan immediately
  }

  window.EtsScanner.attachKeyboardScanner({
    maxGapMs: SCAN_MAX_GAP_MS,
    onScan: tryHandleScan
  });

  (async function init(){
    const restored = loadPersistedSessionEarly(); // must happen before render() — render() itself triggers a draw that would otherwise wipe an unrestored session
    if(!restored) loadPreLoginStateEarly();
    render();
    if(restored){
      renderLoading(document.getElementById('stage'));
      await refreshRemote();
      revalidateRestoredBaskets(); // needs fresh inventory/history data, so only now
      startAutoLogoutTimer();
    }
    renderStage();
  })();
})();
</script>
</body>
</html>
