<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Garage Plus — ETS Safouene Daoud et Cie</title>
  <style>
    :root{--bg:#090a0c;--panel:#121419;--panel2:#191c22;--line:#2b2f38;--text:#f4f5f7;--muted:#9aa1ad;--red:#e4002b;--red2:#ff234b;--green:#29c77f;--orange:#ffae3d;--blue:#4da3ff;--shadow:0 18px 46px rgba(0,0,0,.35)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;background:#0e1014;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{padding:4px 10px 22px}.kia{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px}.brand small{display:block;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-top:6px;font-size:10px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:10px;align-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:11px 12px;text-align:left}.nav button:hover,.nav button.active{background:var(--panel2);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0;color:var(--muted);font-size:12px}.side-foot b{color:#fff}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(9,10,12,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.top h1{font-size:18px;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:7px;padding:9px 13px}.btn:hover{border-color:#555}.btn.primary{background:var(--red);border-color:var(--red)}.btn.primary:hover{background:var(--red2)}.btn.danger{color:#ff718b}.content{padding:26px 28px 50px;max-width:1500px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:20px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.kpi .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.card-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-head h2{font-size:14px;margin:0}.card-body{padding:18px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{min-width:260px;flex:1;background:var(--panel);border:1px solid var(--line);color:#fff;border-radius:7px;padding:10px 12px}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#101216}tr:last-child td{border-bottom:0}tr:hover td{background:#15181e}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;background:#272b34}.pill.green{color:var(--green);background:rgba(41,199,127,.12)}.pill.red{color:#ff718b;background:rgba(228,0,43,.13)}.pill.orange{color:var(--orange);background:rgba(255,174,61,.12)}.pill.blue{color:var(--blue);background:rgba(77,163,255,.12)}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.status-bars{display:grid;gap:12px}.status-row{display:grid;grid-template-columns:125px 1fr 30px;gap:8px;align-items:center}.bar{height:7px;border-radius:99px;background:#262a31;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:99px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #383d47;border-radius:12px;box-shadow:var(--shadow)}.modal.wide{width:min(1050px,100%)}.modal-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px}.x{border:0;background:transparent;color:#fff;font-size:23px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;background:#0e1014;border:1px solid var(--line);border-radius:7px;color:#fff;padding:10px}.field textarea{min-height:85px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.error{background:rgba(228,0,43,.12);border:1px solid rgba(228,0,43,.35);color:#ff8ba0;padding:10px 12px;border-radius:7px;margin-bottom:14px}.detail-head{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:16px}.detail-head h3{margin:0 0 5px}.totals{margin-left:auto;width:280px;display:grid;gap:7px}.totals div{display:flex;justify-content:space-between}.totals .grand{font-size:17px;font-weight:800;border-top:1px solid var(--line);padding-top:8px}.mobile-nav{display:none}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;overflow:auto;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0e1014;position:sticky;top:68px;z-index:4}.mobile-nav button{white-space:nowrap}.content{padding:18px 14px}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{padding:0 15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}table{display:block;overflow:auto}}
    @media(max-width:520px){.kpis{grid-template-columns:1fr}.top h1{font-size:15px}.actions .back-label{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="kia">KIA</div><small>ETS Safouene Daoud et Cie</small></div>
      <nav class="nav" id="desktopNav"></nav>
      <div class="side-foot"><b id="personName">—</b><br><span id="personRole">—</span></div>
    </aside>
    <main class="main">
      <header class="top"><h1 id="pageTitle">Garage Plus</h1><div class="actions"><button class="btn" id="backStock">← <span class="back-label">Stock rapide</span></button><button class="btn danger" id="logout">Déconnexion</button></div></header>
      <nav class="mobile-nav" id="mobileNav"></nav>
      <section class="content" id="content"><div class="empty">Chargement…</div></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="/garage.js"></script>
</body>
</html>
